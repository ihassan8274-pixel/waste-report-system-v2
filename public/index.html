<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام محضر الهالك الاحترافي</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Kufi Arabic','Segoe UI',sans-serif; background:#f0ede4; color:#1a1a1a; -webkit-font-smoothing:antialiased; }
button { font-family:'Noto Kufi Arabic',sans-serif; cursor:pointer; border:none; }
input, select, textarea { font-family:'Noto Kufi Arabic',sans-serif; }

/* ===== LOGIN ===== */
#loginView { min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#1a1508 0%,#3d2e06 40%,#8b6914 100%); padding:16px; }
.login-card { background:#fff; border-radius:24px; padding:44px 32px 36px; width:100%; max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.5); text-align:center; position:relative; overflow:hidden; }
.login-card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px;
  background:linear-gradient(90deg,#d4a017,#f3d87a,#d4a017); }
.login-card .brand-icon { font-size:56px; display:block; margin-bottom:6px; }
.login-card h1 { font-size:22px; color:#3d2e06; font-weight:900; margin-bottom:2px; }
.login-card .sub { color:#8a7a3a; font-size:12px; margin-bottom:28px; }
.login-card label { display:block; text-align:right; font-weight:700; font-size:12px; color:#6b5a1e; margin:16px 0 6px; }
.login-card input { width:100%; padding:14px 16px; border:2px solid #e8dcb0; border-radius:12px;
  font-size:15px; outline:none; transition:.25s; background:#fffdf6; }
.login-card input:focus { border-color:#d4a017; box-shadow:0 0 0 4px rgba(212,160,23,.15); }
.login-card .btn-login { width:100%; margin-top:24px; padding:15px; background:linear-gradient(135deg,#d4a017,#8b6914);
  color:#fff; border-radius:14px; font-size:16px; font-weight:800; box-shadow:0 6px 20px rgba(139,105,20,.4); transition:.25s; }
.login-card .btn-login:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(139,105,20,.5); }
.login-card .btn-login:active { transform:translateY(0); }
.login-error { color:#c82333; font-size:13px; margin-top:14px; min-height:18px; font-weight:600; }
.login-hint { margin-top:20px; padding:12px; background:#fff9e6; border:1px dashed #e0c060; border-radius:12px;
  font-size:11px; color:#8a7a3a; line-height:1.8; }

/* ===== APP LAYOUT ===== */
#appView { display:none; min-height:100vh; }
.sidebar { position:fixed; right:0; top:0; width:250px; height:100vh; background:linear-gradient(180deg,#1a1508,#2a2105);
  color:#fff; padding:0; overflow-y:auto; z-index:100; border-left:3px solid rgba(212,160,23,.3); }
.sidebar .brand { text-align:center; padding:22px 16px 18px; border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(212,160,23,.06); }
.sidebar .brand h2 { font-size:16px; font-weight:900; color:#f3d87a; letter-spacing:.5px; }
.sidebar .brand span { font-size:10px; color:#8a7a3a; display:block; margin-top:3px; }
.sidebar nav { padding:12px 0; }
.sidebar nav a { display:flex; align-items:center; gap:12px; padding:13px 20px; color:#b7a86b;
  text-decoration:none; font-size:13px; font-weight:700; transition:.2s; border-right:3px solid transparent; }
.sidebar nav a:hover { background:rgba(212,160,23,.1); color:#f3d87a; }
.sidebar nav a.active { background:linear-gradient(90deg,rgba(212,160,23,.2),transparent);
  color:#f3d87a; border-right-color:#d4a017; }
.main { margin-right:250px; min-height:100vh; display:flex; flex-direction:column; }
.topbar { background:#fff; padding:14px 24px; display:flex; align-items:center; gap:14px;
  border-bottom:2px solid #ecd98a; box-shadow:0 2px 12px rgba(0,0,0,.04); position:sticky; top:0; z-index:50; }
.topbar .page-title { font-size:18px; font-weight:900; color:#3d2e06; }
.topbar .spacer { flex:1; }
.topbar .user-chip { display:flex; align-items:center; gap:8px; background:linear-gradient(135deg,#fff9e6,#fff3c4);
  border:1.5px solid #ecd98a; padding:6px 14px; border-radius:24px; font-size:12px; font-weight:700; color:#5a4a10; }
.topbar .role-badge { background:linear-gradient(135deg,#d4a017,#b8891a); color:#fff; font-size:10px;
  padding:3px 10px; border-radius:16px; font-weight:800; }
.btn-logout { background:linear-gradient(135deg,#e05767,#c82333); color:#fff; padding:8px 16px;
  border-radius:10px; font-weight:700; font-size:12px; transition:.2s; }
.btn-logout:hover { opacity:.85; }
.content { padding:20px 24px; flex:1; }

/* ===== CARDS / TOOLBAR ===== */
.card { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(90,70,16,.06); border:1.5px solid #ece3c0; }
.card-h { padding:16px 20px; border-bottom:1.5px solid #f0e8cd; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.card-h h3 { font-size:15px; font-weight:900; color:#3d2e06; flex:1; }
.card-b { padding:16px 20px; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.btn { padding:10px 18px; border-radius:10px; font-weight:800; font-size:13px; display:inline-flex;
  align-items:center; gap:6px; transition:.2s; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.btn:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.15); }
.btn:active { transform:translateY(0); }
.btn-gold { background:linear-gradient(135deg,#e8b923,#a47b0e); color:#fff; }
.btn-green { background:linear-gradient(135deg,#33c05a,#1e8a3a); color:#fff; }
.btn-red { background:linear-gradient(135deg,#e05767,#c82333); color:#fff; }
.btn-blue { background:linear-gradient(135deg,#22b8d4,#0e8ca4); color:#fff; }
.btn-gray { background:linear-gradient(135deg,#6c757d,#495057); color:#fff; }
.btn-sm { padding:6px 10px; font-size:11px; border-radius:8px; }
.btn:disabled { opacity:.45; cursor:not-allowed; transform:none !important; }

/* ===== STATS CARDS ===== */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
.stat-card { background:linear-gradient(135deg,#fdf0c8,#fffcf0); border:1.5px solid #e0c060; border-radius:14px;
  padding:16px 12px; text-align:center; transition:.2s; }
.stat-card:hover { transform:translateY(-2px); box-shadow:0 4px 16px rgba(212,160,23,.2); }
.stat-card .val { font-size:24px; font-weight:900; color:#5a4a10; line-height:1.2; }
.stat-card .lbl { font-size:11px; color:#8a7a3a; font-weight:700; margin-top:4px; }
.stat-card.green { background:linear-gradient(135deg,#e2f8e8,#f0fbf3); border-color:#7ddb96; }
.stat-card.green .val { color:#1f7a33; }
.stat-card.blue { background:linear-gradient(135deg,#e0f4fb,#f0f9fc); border-color:#7ec8e3; }
.stat-card.blue .val { color:#0e6e8c; }
.stat-card.purple { background:linear-gradient(135deg,#f0e8fb,#f7f3fc); border-color:#bfa6e0; }
.stat-card.purple .val { color:#6f42c1; }

/* ===== CHARTS ===== */
.charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.chart-box { background:#fff; border-radius:14px; border:1.5px solid #ece3c0; padding:16px; }
.chart-box h4 { font-size:13px; font-weight:900; color:#3d2e06; margin-bottom:10px; }
.chart-box canvas { max-height:280px; }

/* ===== TABLES ===== */
.table-wrap { overflow-x:auto; border-radius:12px; border:1.5px solid #FFE082; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:12px; min-width:580px; }
thead { background:linear-gradient(135deg,#FFFC17,#FFE082); color:#4a360a; }
th { padding:11px 8px; text-align:center; font-weight:800; white-space:nowrap; font-size:12px; }
td { padding:9px 8px; text-align:center; border-bottom:1px solid #f0ead6; }
tbody tr:nth-child(even) td { background:#fffaf0; }
tbody tr:hover td { background:#fff3c4; }
td input, td select { width:100%; padding:7px; border:1.5px solid #e0c060; border-radius:8px; font-size:12px;
  background:#fffdf6; text-align:center; transition:.2s; }
td input:focus, td select:focus { border-color:#d4a017; outline:none; background:#fff6d8; box-shadow:0 0 0 3px rgba(212,160,23,.12); }
.chip { display:inline-block; padding:3px 12px; border-radius:20px; font-size:11px; font-weight:800; }
.chip-draft { background:#fff3c4; color:#8b6914; }
.chip-approved { background:#d4edda; color:#1f7a33; }

/* ===== FORM / VOUCHER ===== */
.voucher { background:#fff; border-radius:20px; border:2.5px solid #FFFC17; padding:24px; box-shadow:0 8px 32px rgba(255,252,23,.2); }
.voucher .hdr { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  border-bottom:3px solid #FFFC17; padding-bottom:14px; margin-bottom:16px; }
.voucher .brand { display:flex; align-items:center; gap:12px; }
.voucher .logo { width:56px; height:56px; object-fit:contain; }
.voucher .company h1 { font-size:20px; font-weight:900; color:#3d2e06; }
.voucher .company h2 { font-size:11px; color:#8a7a3a; font-weight:400; }
.voucher .vtitle { background:linear-gradient(135deg,#FFFC17,#FFE082); color:#4a3608; padding:8px 22px;
  border-radius:30px; font-weight:800; font-size:14px; border:1.5px solid #E6C200; }
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; background:linear-gradient(135deg,#FFFDE7,#FFF9E6);
  padding:14px 18px; border-radius:12px; margin-bottom:14px; border:1.5px solid #FFE082; }
.info-item { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:3px 0; }
.info-item .label { font-weight:700; color:#5a4a10; min-width:90px; font-size:12px; }
.info-item input, .info-item select { font-weight:500; color:#5a4508; border:none; border-bottom:2px solid #e0c060;
  background:transparent; padding:4px 8px; font-size:13px; min-width:120px; outline:none; transition:.3s; }
.info-item input:focus, .info-item select:focus { border-bottom-color:#d4a017; background:rgba(255,243,196,.4); border-radius:4px 4px 0 0; }
.serial-badge { font-weight:900; color:#5a4408; background:linear-gradient(135deg,#FFF8D6,#FFFDE7);
  border:1.5px solid #FFFC17; padding:3px 16px; border-radius:20px; font-size:13px; }
.form-totals { display:flex; justify-content:flex-end; margin:8px 0 4px; }
.form-totals span { background:linear-gradient(135deg,#FFFC17,#FFE082); color:#4a3608; padding:8px 24px;
  border-radius:30px; font-weight:800; font-size:14px; border:1.5px solid #E6C200; }
.notes-box { background:linear-gradient(135deg,#FFFDE7,#FFF9E6); padding:12px 16px; border-radius:12px;
  margin:14px 0; border:1.5px solid #FFE082; border-right:5px solid #FFFC17; }
.notes-box textarea { width:100%; padding:10px; border:1.5px solid #ecd98a; border-radius:10px; font-size:12px;
  background:#fff; resize:vertical; min-height:55px; outline:none; transition:.2s; }
.notes-box textarea:focus { border-color:#d4a017; }
.sig-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px; }
.sig-item { background:linear-gradient(135deg,#FFFDE7,#FFF9E6); padding:12px; border-radius:12px;
  text-align:center; border:1.5px solid #FFE082; }
.sig-item .role { font-weight:800; color:#5a4a10; font-size:11px; display:block; margin-bottom:8px;
  border-bottom:1.5px solid #e0c060; padding-bottom:5px; }
.sig-item input { width:100%; padding:6px; border:none; border-bottom:2px solid #e0c060; background:transparent;
  text-align:center; outline:none; font-size:12px; margin:2px 0; }
.sig-item.approved { border:2.5px solid #FFFC17; background:linear-gradient(135deg,#FFF8D6,#FFFDE7); }

/* ===== MODALS ===== */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(26,21,8,.6); backdrop-filter:blur(4px);
  z-index:999; justify-content:center; align-items:center; padding:12px; }
.modal-overlay.active { display:flex; }
.modal { background:#fff; border-radius:20px; width:100%; max-width:640px; max-height:90vh; overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.45); position:relative; }
.modal::before { content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:linear-gradient(90deg,#d4a017,#f3d87a,#d4a017); border-radius:20px 20px 0 0; }
.modal-h { padding:18px 20px 14px; border-bottom:1.5px solid #f0e8cd; display:flex; align-items:center; }
.modal-h h3 { font-weight:900; color:#3d2e06; flex:1; font-size:15px; }
.modal-x { background:linear-gradient(135deg,#e05767,#c82333); color:#fff; width:32px; height:32px;
  border-radius:50%; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; }
.modal-b { padding:20px; }

/* ===== LOADING ===== */
.loading { text-align:center; padding:40px; color:#8a7a3a; font-size:13px; }
.spinner { width:36px; height:36px; border:4px solid rgba(212,160,23,.2); border-top:4px solid #d4a017;
  border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
@keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }

/* ===== TOAST ===== */
#toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(120px); background:#1a1508;
  color:#f3d87a; padding:12px 28px; border-radius:14px; font-weight:700; font-size:13px; z-index:9999;
  box-shadow:0 8px 32px rgba(0,0,0,.5); transition:.4s; opacity:0; white-space:nowrap; }
#toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
#toast.err { background:linear-gradient(135deg,#c82333,#a01c29); color:#fff; }

.hidden { display:none !important; }
.muted { color:#8a7a3a; }

/* ===== RESPONSIVE: TABLET ===== */
@media (max-width:960px){
  .sidebar { width:210px; }
  .main { margin-right:210px; }
  .charts-grid { grid-template-columns:1fr; }
  .info-grid, .sig-grid { grid-template-columns:1fr; }
  .stats-grid { grid-template-columns:repeat(2,1fr); }
}

/* ===== RESPONSIVE: MOBILE ===== */
@media (max-width:640px){
  .sidebar {
    position:fixed; top:auto; bottom:0; right:0; left:0; width:100%; height:auto;
    padding:0 0 calc(0px + env(safe-area-inset-bottom));
    display:block; overflow:hidden; border-top:2px solid #d4a017;
    box-shadow:0 -4px 20px rgba(0,0,0,.3); z-index:200;
    background:linear-gradient(180deg,#1e1a0c,#2a2105);
  }
  .sidebar .brand { display:none; }
  .sidebar nav { display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0; scrollbar-width:none; }
  .sidebar nav::-webkit-scrollbar { display:none; }
  .sidebar nav a {
    white-space:nowrap; padding:10px 14px; border-right:none; border-top:2.5px solid transparent;
    font-size:11px; min-height:48px; justify-content:center;
    background:rgba(212,160,23,.04); color:#8a7a3a; flex-direction:column; gap:2px;
  }
  .sidebar nav a.active { border-right:none; border-top-color:#d4a017; background:rgba(212,160,23,.12); color:#f3d87a; }
  .main { margin-right:0; }
  .topbar { padding:10px 14px; gap:8px; flex-wrap:wrap; position:sticky; top:0; }
  .topbar .page-title { font-size:14px; }
  .topbar .user-chip { padding:4px 10px; font-size:10px; }
  .topbar .role-badge { display:none; }
  .btn-logout { padding:6px 10px; font-size:10px; min-height:32px; }
  .content { padding:12px 10px calc(64px + env(safe-area-inset-bottom)); }
  .btn { min-height:44px; padding:12px 14px; font-size:13px; touch-action:manipulation; border-radius:12px; }
  .btn-sm { min-height:34px; padding:7px 10px; font-size:11px; border-radius:8px; }
  .modal-x { width:36px; height:36px; font-size:16px; }
  input, select, textarea { font-size:16px; }
  td input, td select, .info-item input, .info-item select, .sig-item input { font-size:16px; }
  .toolbar { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .toolbar .muted { grid-column:1 / -1; text-align:center; align-self:center; }
  .toolbar button { width:100%; justify-content:center; }
  .voucher { padding:14px 10px; border-radius:16px; border-width:2px; }
  .voucher .hdr { justify-content:center; text-align:center; padding-bottom:10px; }
  .voucher .vtitle { font-size:13px; padding:7px 14px; }
  .info-grid { grid-template-columns:1fr; padding:10px 12px; gap:8px; }
  .info-item { flex-direction:column; gap:3px; }
  .info-item .label { min-width:0; }
  .info-item input, .info-item select { width:100%; min-width:0; padding:10px 8px; }
  .form-totals span { font-size:13px; padding:7px 14px; }
  .notes-box textarea { font-size:16px; min-height:70px; }
  .sig-grid { grid-template-columns:1fr; gap:10px; }
  .login-card { padding:32px 20px 28px; border-radius:20px; }
  .login-card .btn-login { font-size:15px; padding:14px; }
  .stats-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
  .stat-card { padding:12px 8px; border-radius:12px; }
  .stat-card .val { font-size:20px; }
  .stat-card .lbl { font-size:10px; }
  .modal { max-width:100%; border-radius:16px; }
  .modal-h { padding:14px; }
  .modal-b { padding:14px; }
  .table-wrap { border-radius:10px; }
  .card { border-radius:14px; }
  .card-b { padding:12px 14px; }
  #toast { bottom:72px; font-size:12px; padding:10px 20px; }
}

@media (max-width:400px){
  .stats-grid { grid-template-columns:1fr 1fr; gap:6px; }
  .toolbar { grid-template-columns:1fr; }
  .topbar .user-chip span:first-child { max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
}

/* ===== PRINT / PDF ===== */
#printArea { display:none; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  html, body { margin:0 !important; padding:0 !important; background:#fff !important; }
  body > *:not(#printArea) { display:none !important; }
  #printArea { display:block !important; position:static !important; width:210mm !important; max-width:none !important; padding:0 !important; margin:0 !important; }
  #printArea .voucher { width:210mm !important; margin:0 !important; box-shadow:none !important; border-radius:0 !important; border:2px solid #FFFC17; padding:8mm 8mm !important; }
  #printArea .hdr { border-bottom:3px solid #FFFC17; margin-bottom:6mm; }
  #printArea .vtitle { font-size:15px; }
  #printArea table { font-size:10.5px; }
  #printArea .info-grid, #printArea .notes-box, #printArea .sig-grid { page-break-inside: avoid; }
  #printArea table tr { page-break-inside: avoid; }
  #printArea .logo { width:18mm; height:18mm; }
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="login-card">
    <span class="brand-icon">📋</span>
    <h1>نظام محضر الهالك</h1>
    <div class="sub" id="loginCompany">إدارة المحاضر وتسجيل الهالك</div>
    <label>اسم المستخدم</label>
    <input type="text" id="loginUser" autocomplete="username" placeholder="admin">
    <label>كلمة المرور</label>
    <input type="password" id="loginPass" autocomplete="current-password" placeholder="••••••••">
    <div class="login-error" id="loginError"></div>
    <button class="btn-login" onclick="doLogin()">تسجيل الدخول</button>
    <div class="login-hint">🔑 البيانات الافتراضية:<br>المستخدم: <b>admin</b> | كلمة المرور: <b>admin123</b><br>غيّرها من الإعدادات بعد الدخول</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView">
  <aside class="sidebar">
    <div class="brand">
      <h2 id="sideCompany">نظام محضر الهالك</h2>
      <span>شركة مطاعم معصوب حليب</span>
    </div>
    <nav id="sideNav"></nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle">لوحة التحكم</div>
      <div class="spacer"></div>
      <div class="user-chip"><span id="userName">—</span><span class="role-badge" id="userRole">—</span></div>
      <button class="btn-logout" onclick="doLogout()">🚪 خروج</button>
    </div>
    <div class="content">
      <div id="viewDashboard" class="view"></div>
      <div id="viewForm" class="view hidden"></div>
      <div id="viewReports" class="view hidden"></div>
      <div id="viewItems" class="view hidden"></div>
      <div id="viewBranches" class="view hidden"></div>
      <div id="viewUsers" class="view hidden"></div>
      <div id="viewPermissions" class="view hidden"></div>
      <div id="viewSettings" class="view hidden"></div>
    </div>
  </div>
</div>

<!-- ================= MODALS ================= -->
<div class="modal-overlay" id="modalViewReport"><div class="modal"><div class="modal-h"><h3>عرض المحضر</h3><button class="modal-x" onclick="closeModal('modalViewReport')">✕</button></div><div class="modal-b" id="viewReportBody"></div></div></div>
<div class="modal-overlay" id="modalEditReport"><div class="modal"><div class="modal-h"><h3>تعديل المحضر</h3><button class="modal-x" onclick="closeModal('modalEditReport')">✕</button></div><div class="modal-b" id="editReportBody"></div></div></div>
<div class="modal-overlay" id="modalItem"><div class="modal"><div class="modal-h"><h3 id="itemModalTitle">صنف</h3><button class="modal-x" onclick="closeModal('modalItem')">✕</button></div><div class="modal-b" id="itemModalBody"></div></div></div>
<div class="modal-overlay" id="modalBranch"><div class="modal"><div class="modal-h"><h3 id="branchModalTitle">فرع</h3><button class="modal-x" onclick="closeModal('modalBranch')">✕</button></div><div class="modal-b" id="branchModalBody"></div></div></div>
<div class="modal-overlay" id="modalUser"><div class="modal"><div class="modal-h"><h3 id="userModalTitle">مستخدم</h3><button class="modal-x" onclick="closeModal('modalUser')">✕</button></div><div class="modal-b" id="userModalBody"></div></div></div>

<div id="toast"></div>

<script>
/* ================= STATE ================= */
const state = { token: localStorage.getItem('wasteToken') || null, user: null, branches: [], items: [], permissions: {} };
let charts = {};

function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className = '', 3200);
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, { ...opts, headers });
  if (res.status === 401) { doLogout(true); throw new Error('انتهت الجلسة'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'خطأ في الطلب');
  return data;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* ================= AUTH ================= */
function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  document.getElementById('loginError').textContent = '';
  api('/api/login', { method: 'POST', body: JSON.stringify({ username, password }) })
    .then(data => {
      state.token = data.token; state.user = data.user;
      localStorage.setItem('wasteToken', state.token);
      enterApp();
    })
    .catch(e => document.getElementById('loginError').textContent = e.message);
}
function doLogout(silent) {
  if (state.token) fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + state.token } }).catch(() => {});
  state.token = null; state.user = null;
  localStorage.removeItem('wasteToken');
  if (!silent) toast('تم تسجيل الخروج', true);
  document.getElementById('appView').style.display = 'none';
  document.getElementById('loginView').style.display = 'flex';
}

/* ================= ROUTING ================= */
const ROLE_LABEL = { admin: 'مدير النظام', manager: 'مدير فرع', employee: 'موظف' };
const PAGES = [
  { id: 'dashboard', label: '📊 لوحة التحكم', perm: 'dashboard.view', title: 'لوحة التحكم' },
  { id: 'form', label: '📋 نموذج محضر هالك', perm: 'reports.create', title: 'نموذج محضر هالك' },
  { id: 'reports', label: '🗂️ سجل المحاضر', perm: 'reports.read', title: 'سجل المحاضر' },
  { id: 'items', label: '🧺 الأصناف', perm: 'items.read', title: 'الأصناف' },
  { id: 'branches', label: '🏢 الفروع', perm: 'branches.read', title: 'الفروع' },
  { id: 'users', label: '👥 المستخدمين', perm: 'users.read', title: 'المستخدمين' },
  { id: 'permissions', label: '🔐 الصلاحيات', perm: 'permissions.read', title: 'الصلاحيات' },
  { id: 'settings', label: '⚙️ الإعدادات', perm: 'settings.read', title: 'الإعدادات' }
];
let currentPage = 'dashboard';

function hasPermission(module, action) {
  if (!state.permissions) return false;
  return state.permissions[module]?.[action] === true;
}

function buildNav() {
  const nav = document.getElementById('sideNav');
  nav.innerHTML = '';
  PAGES.filter(p => {
    const [module, action] = p.perm.split('.');
    return hasPermission(module, action);
  }).forEach(p => {
    const a = document.createElement('a');
    a.href = '#';
    a.id = 'nav-' + p.id;
    a.textContent = p.label;
    a.onclick = e => { e.preventDefault(); showPage(p.id); };
    nav.appendChild(a);
  });
}
function showPage(id) {
  currentPage = id;
  const page = PAGES.find(p => p.id === id);
  if (!page) { id = 'dashboard'; }
  else {
    const [module, action] = page.perm.split('.');
    if (!hasPermission(module, action)) id = 'dashboard';
  }
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  document.getElementById('view' + id.charAt(0).toUpperCase() + id.slice(1)).classList.remove('hidden');
  document.querySelectorAll('#sideNav a').forEach(a => a.classList.remove('active'));
  const navEl = document.getElementById('nav-' + id);
  if (navEl) navEl.classList.add('active');
  document.getElementById('pageTitle').textContent = PAGES.find(p => p.id === id).title;
  if (id === 'dashboard') loadDashboard();
  if (id === 'form') initFormView();
  if (id === 'reports') loadReports();
  if (id === 'items') loadItems();
  if (id === 'branches') loadBranches();
  if (id === 'users') loadUsers();
  if (id === 'permissions') loadPermissions();
  if (id === 'settings') loadSettings();
}

async function enterApp() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'flex';
  document.getElementById('userName').textContent = state.user.name;
  document.getElementById('userRole').textContent = ROLE_LABEL[state.user.role] || state.user.role;
  state.permissions = state.user.permissions || {};
  try {
    if (hasPermission('branches', 'read')) {
      const b = await api('/api/branches'); state.branches = b.branches;
    }
    if (hasPermission('items', 'read')) {
      const i = await api('/api/items'); state.items = i.items;
    }
  } catch (e) {}
  buildNav();
  showPage('dashboard');
}

/* ================= DASHBOARD ================= */
function loadDashboard() {
  const v = document.getElementById('viewDashboard');
  v.innerHTML = '<div class="loading"><div class="spinner"></div>جاري تحميل البيانات...</div>';
  const from = document.getElementById('dashFrom') ? document.getElementById('dashFrom').value : '';
  const to = document.getElementById('dashTo') ? document.getElementById('dashTo').value : '';
  const branch = document.getElementById('dashBranch') ? document.getElementById('dashBranch').value : '';
  let url = '/api/stats?';
  if (from) url += 'from=' + from + '&';
  if (to) url += 'to=' + to + '&';
  if (branch) url += 'branch=' + branch + '&';
  api(url).then(s => renderDashboard(v, s));
}

function monthKey(d) { return d; }

function renderDashboard(v, s) {
  const t = s.totals;
  const branchOpts = '<option value="">كل الفروع</option>' + state.branches.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
  v.innerHTML = `
    <div class="toolbar">
      <input type="date" id="dashFrom" value="">
      <input type="date" id="dashTo" value="">
      <select id="dashBranch">${branchOpts}</select>
      <button class="btn btn-gold" onclick="loadDashboard()">عرض</button>
      <button class="btn btn-blue btn-sm" onclick="exportDashboard()">📤 تصدير CSV</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="val">${t.reports_count}</div><div class="lbl">عدد المحاضر</div></div>
      <div class="stat-card"><div class="val">${Number(t.total_qty).toFixed(1)}</div><div class="lbl">إجمالي الكميات</div></div>
      <div class="stat-card green"><div class="val">${Number(t.total_value).toFixed(2)}</div><div class="lbl">إجمالي قيمة الهالك (ريال)</div></div>
      <div class="stat-card"><div class="val">${Number(t.total_cost || 0).toFixed(2)}</div><div class="lbl">قيمة الشراء التقديرية</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-box"><h4>📈 الهالك الشهري</h4><canvas id="chartMonthly"></canvas></div>
      <div class="chart-box"><h4>🏢 الهالك حسب الفروع</h4><canvas id="chartBranch"></canvas></div>
      <div class="chart-box"><h4>🗂️ توزيع أنواع الفاقد</h4><canvas id="chartType"></canvas></div>
      <div class="chart-box"><h4>🧺 أكثر الأصناف هالكاً</h4><canvas id="chartItems"></canvas></div>
    </div>`;
  Object.values(charts).forEach(c => { try { c.destroy(); } catch (e) {} });
  charts = {};
  const monthData = s.monthly.map(m => m.value);
  charts.monthly = new Chart(document.getElementById('chartMonthly'), { type: 'bar',
    data: { labels: s.monthly.map(m => m.month), datasets: [{ label: 'قيمة الهالك', data: monthData,
      backgroundColor: '#d4a017', borderRadius: 6 }] },
    options: { responsive: true, plugins: { legend: { display: false } } } });
  charts.branch = new Chart(document.getElementById('chartBranch'), { type: 'doughnut',
    data: { labels: s.byBranch.map(b => b.branch), datasets: [{ data: s.byBranch.map(b => b.value),
      backgroundColor: ['#d4a017','#218838','#17a2b8','#e05767','#6f42c1','#fd7e14'] }] },
    options: { responsive: true } });
  charts.type = new Chart(document.getElementById('chartType'), { type: 'pie',
    data: { labels: s.byType.map(t => t.type), datasets: [{ data: s.byType.map(t => t.value),
      backgroundColor: ['#e05767','#17a2b8','#fd7e14','#6f42c1','#20c997'] }] },
    options: { responsive: true } });
  charts.items = new Chart(document.getElementById('chartItems'), { type: 'bar',
    data: { labels: s.topItems.map(i => i.name), datasets: [{ label: 'الكمية', data: s.topItems.map(i => i.qty),
      backgroundColor: '#218838', borderRadius: 6 }] },
    options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } } } });
}

function exportDashboard() {
  const from = document.getElementById('dashFrom').value;
  const to = document.getElementById('dashTo').value;
  api('/api/stats?' + new URLSearchParams({ from, to })).then(s => {
    const rows = [['المؤشر', 'القيمة']];
    rows.push(['عدد المحاضر', s.totals.reports_count]);
    rows.push(['إجمالي الكميات', s.totals.total_qty]);
    rows.push(['إجمالي قيمة الهالك', s.totals.total_value]);
    rows.push([]);
    rows.push(['الشهر', 'قيمة الهالك']);
    s.monthly.forEach(m => rows.push([m.month, m.value]));
    rows.push([]);
    rows.push(['الفرع', 'القيمة', 'عدد المحاضر']);
    s.byBranch.forEach(b => rows.push([b.branch, b.value, b.count]));
    rows.push([]);
    rows.push(['نوع الفاقد', 'القيمة', 'الكمية']);
    s.byType.forEach(t => rows.push([t.type, t.value, t.qty]));
    const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    downloadCsv(csv, 'Dashboard_Stats.csv');
  }).catch(e => toast(e.message, true));
}

function downloadCsv(csv, name) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

/* ================= FORM ================= */
let formItems = [];
let currentEditReportId = null;

function initFormView() {
  if (formInitDone) return;
  formInitDone = true;
  buildForm();
}
let formInitDone = false;

function buildForm() {
  const v = document.getElementById('viewForm');
  const branchOpts = state.branches.map(b => `<option value="${b.id}" ${b.id === state.user.branch_id ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
  const datalist = state.items.map(i => `<option value="${esc(i.name)}"></option>`).join('');
  v.innerHTML = `
    <div class="voucher">
      <div class="hdr">
        <div class="company"><h1 id="fCompany">شركة مطاعم معصوب حليب</h1><h2 id="fCompanySub">لتقديم الوجبات</h2></div>
        <div class="vtitle">📋 محضر هالك جديد</div>
      </div>
      <datalist id="itemList">${datalist}</datalist>
      <div class="info-grid">
        <div class="info-item"><span class="label">الفرع:</span><select id="fBranch">${branchOpts}</select></div>
        <div class="info-item"><span class="label">رقم المحضر:</span><span class="serial-badge" id="fSerial">سيُعطى عند الحفظ</span></div>
        <div class="info-item"><span class="label">التاريخ:</span><input type="date" id="fDate"></div>
        <div class="info-item"><span class="label">المسؤول:</span><input type="text" id="fResponsible" placeholder="اسم المسؤول"></div>
      </div>
      <div class="table-wrap" style="margin-bottom:10px;">
        <table id="fTable">
          <thead><tr><th>#</th><th>اسم الصنف</th><th>الوحدة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>نوع الفاقد</th><th>تاريخ الإنتاج</th><th>تاريخ الصلاحية</th><th>سبب الهالك</th><th>حذف</th></tr></thead>
          <tbody id="fTableBody"></tbody>
        </table>
      </div>
      <div class="toolbar">
        <button class="btn btn-gold" onclick="fAddRow()">➕ إضافة صنف</button>
        <button class="btn btn-green" onclick="fAddRow3()">➕ إضافة 3 أصناف</button>
        <span class="muted" id="fRowCount" style="font-size:12px;align-self:center;">0 أصناف</span>
      </div>
      <div class="form-totals"><span>الإجمالي الكلي : <span id="fTotal">0.00</span> ريال</span></div>
      <div class="notes-box"><strong>📝 ملاحظات :</strong><br>
        <textarea id="fNotes">• تم إعداد هذا المحضر لتسجيل الأصناف الهالكة.
• تم الفحص بحضور لجنة الجرد والتأكد من أسباب الهالك.</textarea></div>
      <div class="sig-grid">
        <div class="sig-item"><span class="role">📋 عضو لجنة الجرد</span><input type="text" placeholder="الاسم" id="fM1Name"><input type="text" placeholder="التوقيع" id="fM1Sig"></div>
        <div class="sig-item"><span class="role">📋 عضو لجنة الجرد</span><input type="text" placeholder="الاسم" id="fM2Name"><input type="text" placeholder="التوقيع" id="fM2Sig"></div>
        <div class="sig-item approved"><span class="role">✅ اعتماد مدير الفرع</span><input type="text" placeholder="الاسم" id="fMgrName"><input type="text" placeholder="التوقيع" id="fMgrSig"></div>
      </div>
      <div class="toolbar" style="margin-top:18px;justify-content:flex-end;">
        <button class="btn btn-green" onclick="saveReport()">💾 حفظ المحضر</button>
        <button class="btn btn-blue" onclick="generateFormPDF()">📄 PDF</button>
        <button class="btn btn-red" onclick="fReset()">🔄 مسح النموذج</button>
      </div>
    </div>`;
  document.getElementById('fDate').value = new Date().toISOString().slice(0, 10);
  const itemsInputs = v.querySelectorAll('#fTableBody');
  formItems = [];
  fAddRow();
}

function fAddRow() {
  formItems.push({ item_name: '', unit: '_____', qty: 1, price: 0, waste_type: 'أخرى', prod_date: '', exp_date: '', reason: '' });
  fRenderRows();
}
function fAddRow3() { for (let i = 0; i < 3; i++) fAddRow(); }
function fRemoveRow(i) {
  if (formItems.length <= 1) { toast('لا يمكن حذف آخر صنف', true); return; }
  formItems.splice(i, 1); fRenderRows();
}
function fRenderRows() {
  const tbody = document.getElementById('fTableBody');
  tbody.innerHTML = '';
  formItems.forEach((it, i) => {
    const types = ['تحضير','طهي','تخزين','خدمة','انتهاء صلاحية','أخرى'];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td><input type="text" list="itemList" value="${esc(it.item_name)}" placeholder="اختر صنف..." oninput="onItemInput(${i},this.value)" onchange="onItemChange(${i},this.value)" autocomplete="off"></td>
      <td><input type="text" value="${esc(it.unit)}" oninput="formItems[${i}].unit=this.value"></td>
      <td><input type="number" min="0" step="0.5" value="${it.qty}" oninput="formItems[${i}].qty=parseFloat(this.value)||0;fCalc()"></td>
      <td><input type="number" min="0" step="0.5" value="${it.price}" oninput="formItems[${i}].price=parseFloat(this.value)||0;fCalc()"></td>
      <td><input type="number" readonly value="${(it.qty * it.price).toFixed(2)}" style="background:#f5ecc9;font-weight:700;"></td>
      <td><select onchange="formItems[${i}].waste_type=this.value">${types.map(t => `<option ${t === it.waste_type ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td><input type="date" value="${esc(it.prod_date)}" oninput="formItems[${i}].prod_date=this.value"></td>
      <td><input type="date" value="${esc(it.exp_date)}" oninput="formItems[${i}].exp_date=this.value"></td>
      <td><input type="text" value="${esc(it.reason)}" placeholder="السبب" oninput="formItems[${i}].reason=this.value"></td>
      <td><button class="btn btn-red btn-sm" onclick="fRemoveRow(${i})">✕</button></td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('fRowCount').textContent = formItems.length + ' أصناف';
  fCalc();
}

function onItemInput(index, value) {
  formItems[index].item_name = value;
  const match = state.items.find(i => i.name.toLowerCase() === value.toLowerCase());
  if (match) {
    formItems[index].item_id = match.id;
    formItems[index].unit = match.unit || '';
    formItems[index].price = match.default_price || 0;
    const tr = document.getElementById('fTableBody').children[index];
    if (tr) {
      tr.children[2].querySelector('input').value = match.unit || '';
      tr.children[4].querySelector('input').value = (match.default_price || 0);
    }
  } else {
    formItems[index].item_id = null;
  }
  fCalc();
}
function onItemChange(index, value) {
  formItems[index].item_name = value;
  const match = state.items.find(i => i.name.toLowerCase() === value.toLowerCase());
  if (match) {
    formItems[index].item_id = match.id;
    formItems[index].unit = match.unit || '';
    formItems[index].price = match.default_price || 0;
    const tr = document.getElementById('fTableBody').children[index];
    if (tr) {
      tr.children[2].querySelector('input').value = match.unit || '';
      tr.children[4].querySelector('input').value = (match.default_price || 0);
    }
  } else {
    formItems[index].item_id = null;
  }
  fCalc();
}
function fCalc() {
  let total = 0;
  const tbody = document.getElementById('fTableBody');
  tbody.querySelectorAll('tr').forEach((tr, i) => {
    if (!formItems[i]) return;
    const inputs = tr.querySelectorAll('input');
    const t = (formItems[i].qty * formItems[i].price);
    inputs[4].value = t.toFixed(2);
    total += t;
  });
  document.getElementById('fTotal').textContent = total.toFixed(2);
}
function fReset() {
  if (!confirm('مسح كل بيانات النموذج الحالي؟')) return;
  formItems = [];
  fAddRow();
  document.getElementById('fNotes').value = '';
  ['fResponsible','fM1Name','fM1Sig','fM2Name','fM2Sig','fMgrName','fMgrSig'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fSerial').textContent = 'سيُعطى عند الحفظ';
  currentEditReportId = null;
  toast('تم مسح النموذج');
}

async function saveReport() {
  const valid = formItems.filter(i => i.item_name && i.qty > 0);
  if (!valid.length) return toast('أضف صنفاً واحداً على الأقل مع الكمية', true);
  const payload = {
    branch_id: document.getElementById('fBranch').value || null,
    date: document.getElementById('fDate').value,
    responsible: document.getElementById('fResponsible').value,
    notes: document.getElementById('fNotes').value,
    status: 'مسودة',
    items: valid.map(it => ({
      item_id: it.item_id || null,
      item_name: it.item_name,
      unit: it.unit,
      qty: it.qty,
      price: it.price,
      waste_type: it.waste_type,
      prod_date: it.prod_date,
      exp_date: it.exp_date,
      reason: it.reason
    }))
  };
  try {
    let data;
    if (currentEditReportId) {
      data = await api('/api/reports/' + currentEditReportId, { method: 'PUT', body: JSON.stringify(payload) });
      toast('تم تحديث المحضر بنجاح');
    } else {
      data = await api('/api/reports', { method: 'POST', body: JSON.stringify(payload) });
      document.getElementById('fSerial').textContent = data.serial;
      toast('تم حفظ المحضر برقم ' + data.serial);
    }
    currentEditReportId = data.report.id;
  } catch (e) { toast(e.message, true); }
}

/* ================= FORM PDF ================= */
async function generateFormPDF() {
  const serial = currentEditReportId ? state._lastSerial || 'مؤقت' : 'مؤقت';
  const v = document.getElementById('viewForm').querySelector('.voucher');
  const loading = document.createElement('div');
  loading.style.cssText = 'position:fixed;inset:0;background:rgba(50,36,5,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;font-weight:700;';
  loading.innerHTML = '<div class="spinner"></div>جاري إنشاء PDF...';
  document.body.appendChild(loading);
  try {
    const canvas = await html2canvas(v, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const JsPDF = window.jspdf.jsPDF;
    const pdf = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
    const imgW = canvas.width / 96 * 25.4, imgH = canvas.height / 96 * 25.4;
    const scale = Math.min((pageW - 8) / imgW, (pageH - 8) / imgH);
    pdf.addImage(canvas.toDataURL('image/jpeg', .95), 'JPEG', (pageW - imgW * scale) / 2, (pageH - imgH * scale) / 2, imgW * scale, imgH * scale);
    const name = safeName(currentEditReportId ? 'WasteReport' : 'WasteReportDraft', 'pdf');
    pdf.save(name);
  } catch (e) { toast('خطأ في إنشاء PDF: ' + e.message, true); }
  loading.remove();
}
function safeName(prefix, ext) {
  const d = new Date().toISOString().slice(0, 10).replace(/-/g, '-');
  return prefix + '_' + d + '_' + Date.now().toString().slice(-6) + '.' + ext;
}

async function exportReportPDF(id) {
  const loading = addLoading('جاري إنشاء PDF...');
  try {
    const d = await api('/api/reports/' + id);
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-9999px;top:0;width:794px;background:#fff;z-index:-1;';
    holder.innerHTML = reportHTML(d.report, d.items);
    document.body.appendChild(holder);
    await Promise.all(Array.from(holder.querySelectorAll('img')).map(im => im.complete ? Promise.resolve() : new Promise(res => { im.onload = res; im.onerror = res; })));
    await new Promise(r => setTimeout(r, 300));
    const canvas = await html2canvas(holder.firstElementChild, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    const JsPDF = window.jspdf.jsPDF;
    const pdf = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const pageW = 210, pageH = 297;
    const pxPerMm = canvas.width / pageW;
    const sliceH = Math.max(1, Math.floor(pageH * pxPerMm));
    const sliceCanvas = document.createElement('canvas');
    sliceCanvas.width = canvas.width;
    sliceCanvas.height = sliceH;
    const sctx = sliceCanvas.getContext('2d');
    let pages = 0;
    for (let y = 0; y < canvas.height; y += sliceH) {
      if (pages > 0) pdf.addPage();
      const h = Math.min(sliceH, canvas.height - y);
      sctx.clearRect(0, 0, canvas.width, sliceH);
      sctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, sliceH);
      pdf.addImage(sliceCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pageW, pageH);
      pages++;
    }
    pdf.save(safeName('WasteReport', 'pdf'));
    holder.remove();
  } catch (e) { toast('خطأ في إنشاء PDF: ' + e.message, true); }
  loading.remove();
}

async function downloadReportCsv(id) {
  try {
    const res = await fetch('/api/reports/' + id + '/export', { headers: { 'Authorization': 'Bearer ' + state.token } });
    if (!res.ok) throw new Error('تعذر التصدير');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url;
    const cd = res.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="([^"]+)"/);
    a.download = m ? m[1] : 'WasteReport.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast(e.message, true); }
}

      <tbody>${rows}</tbody></table></div></div></div>
      <div class="hidden" id="userBranchOpts">${branchOpts}</div>`;
  } catch (e) { v.innerHTML = '<div class="loading">' + esc(e.message) + '</div>'; }
}
function openUserModal(id, username, name, role, branchId) {
  const branchOpts = document.getElementById('userBranchOpts').innerHTML;
  const roleOpts = [['employee','موظف'],['manager','مدير فرع'],['admin','مدير النظام']]
    .map(r => `<option value="${r[0]}" ${(role || 'employee') === r[0] ? 'selected' : ''}>${r[1]}</option>`).join('');
  document.getElementById('userModalTitle').textContent = id ? 'تعديل مستخدم' : 'إضافة مستخدم';
  document.getElementById('userModalBody').innerHTML = `
    <input type="hidden" id="usrId" value="${id || ''}">
    <div class="info-grid">
      <div class="info-item"><span class="label">الاسم:</span><input type="text" id="usName" value="${name ? esc(name) : ''}"></div>
      <div class="info-item"><span class="label">اسم المستخدم:</span><input type="text" id="usUsername" value="${username ? esc(username) : ''}" ${id ? 'readonly' : ''}></div>
      <div class="info-item"><span class="label">الدور:</span><select id="usRole">${roleOpts}</select></div>
      <div class="info-item"><span class="label">الفرع:</span><select id="usBranch">${branchOpts}</select></div>
      <div class="info-item"><span class="label">كلمة المرور ${id ? '(جديدة)' : ''}:</span><input type="password" id="usPass" placeholder="${id ? 'اتركها فارغة للإبقاء' : 'كلمة المرور'}"></div>
    </div>
    <div class="toolbar" style="justify-content:flex-end;"><button class="btn btn-green" onclick="saveUser()">💾 حفظ</button></div>`;
  if (branchId && document.getElementById('usBranch')) document.getElementById('usBranch').value = branchId;
  openModal('modalUser');
}
async function saveUser() {
  const id = document.getElementById('usrId').value;
  const body = {
    name: document.getElementById('usName').value,
    username: document.getElementById('usUsername').value,
    role: document.getElementById('usRole').value,
    branch_id: document.getElementById('usBranch').value || null,
    password: document.getElementById('usPass').value
  };
  if (!id && !body.password) return toast('كلمة المرور مطلوبة', true);
  try {
    if (id) {
      const b = { name: body.name, role: body.role, branch_id: body.branch_id };
      if (body.password) b.password = body.password;
      await api('/api/users/' + id, { method: 'PUT', body: JSON.stringify(b) });
    } else await api('/api/users', { method: 'POST', body: JSON.stringify(body) });
    closeModal('modalUser'); toast('تم الحفظ'); loadUsers();
  } catch (e) { toast(e.message, true); }
}
async function deleteUser(id) {
  if (!confirm('حذف المستخدم؟')) return;
  try { await api('/api/users/' + id, { method: 'DELETE' }); toast('تم الحذف'); loadUsers(); }
  catch (e) { toast(e.message, true); }
}
function openChangePass() {
  document.getElementById('modalUser').classList.add('active');
  document.getElementById('userModalTitle').textContent = 'تغيير كلمة المرور';
  document.getElementById('userModalBody').innerHTML = `
    <div class="info-grid">
      <div class="info-item"><span class="label">كلمة المرور الحالية:</span><input type="password" id="cpCur"></div>
      <div class="info-item"><span class="label">كلمة المرور الجديدة:</span><input type="password" id="cpNext"></div>
    </div>
    <div class="toolbar" style="justify-content:flex-end;"><button class="btn btn-green" onclick="saveChangePass()">💾 حفظ</button></div>`;
}
async function saveChangePass() {
  try {
    await api('/api/me/password', { method: 'PUT', body: JSON.stringify({ current: document.getElementById('cpCur').value, next: document.getElementById('cpNext').value }) });
    closeModal('modalUser'); toast('تم تغيير كلمة المرور');
  } catch (e) { toast(e.message, true); }
}

/* ================= PERMISSIONS ================= */
const MODULE_LABELS = {
  dashboard: 'لوحة التحكم',
  reports: 'المحاضر',
  items: 'الأصناف',
  branches: 'الفروع',
  users: 'المستخدمين',
  settings: 'الإعدادات',
  permissions: 'الصلاحيات'
};
const ACTION_LABELS = {
  view: 'عرض',
  create: 'إضافة',
  read: 'قراءة',
  update: 'تعديل',
  delete: 'حذف',
  export: 'تصدير'
};

async function loadPermissions() {
  const v = document.getElementById('viewPermissions');
  v.innerHTML = '<div class="loading"><div class="spinner"></div>جاري تحميل الصلاحيات...</div>';
  try {
    const data = await api('/api/permissions');
    renderPermissions(v, data.permissions);
  } catch (e) { v.innerHTML = '<div class="loading">' + esc(e.message) + '</div>'; }
}

function renderPermissions(v, permissions) {
  const roles = ['admin', 'manager', 'employee'];
  const modules = Object.keys(MODULE_LABELS);
  const actions = ['view', 'create', 'read', 'update', 'delete', 'export'];

  let html = '<div class="card"><div class="card-h"><h3>🔐 إدارة الصلاحيات حسب الدور</h3></div><div class="card-b">';
  html += '<div class="table-wrap"><table><thead><tr><th>الوحدة</th><th>الإجراء</th>';
  roles.forEach(r => html += `<th>${ROLE_LABEL[r]}</th>`);
  html += '</tr></thead><tbody>';

  modules.forEach(mod => {
    actions.forEach(act => {
      const relevant = (mod === 'dashboard' && act === 'view') ||
                       (mod === 'reports' && ['create', 'read', 'update', 'delete', 'export'].includes(act)) ||
                       (mod === 'items' && ['create', 'read', 'update', 'delete'].includes(act)) ||
                       (mod === 'branches' && ['create', 'read', 'update', 'delete'].includes(act)) ||
                       (mod === 'users' && ['create', 'read', 'update', 'delete'].includes(act)) ||
                       (mod === 'settings' && ['read', 'update'].includes(act)) ||
                       (mod === 'permissions' && ['read', 'update'].includes(act));
      if (!relevant) return;

      html += `<tr><td><b>${MODULE_LABELS[mod]}</b></td><td>${ACTION_LABELS[act]}</td>`;
      roles.forEach(r => {
        const checked = permissions[r]?.[mod]?.[act] ? 'checked' : '';
        html += `<td><label style="cursor:pointer;"><input type="checkbox" ${checked} onchange="togglePerm('${r}','${mod}','${act}',this.checked)" style="width:20px;height:20px;cursor:pointer;"> مسموح</label></td>`;
      });
      html += '</tr>';
    });
  });

  html += '</tbody></table></div>';
  html += '<div class="toolbar" style="margin-top:16px;justify-content:flex-end;">';
  html += '<button class="btn btn-green" onclick="saveAllPermissions()">💾 حفظ جميع التغييرات</button>';
  html += '</div>';
  html += '</div></div>';
  v.innerHTML = html;
}

let pendingPerms = {};

function togglePerm(role, mod, act, allowed) {
  if (!pendingPerms[role]) pendingPerms[role] = {};
  if (!pendingPerms[role][mod]) pendingPerms[role][mod] = {};
  pendingPerms[role][mod][act] = allowed;
}

async function saveAllPermissions() {
  if (!Object.keys(pendingPerms).length) {
    toast('لم يتم تغيير أي صلاحية');
    return;
  }
  try {
    for (const [role, modules] of Object.entries(pendingPerms)) {
      await api('/api/permissions/' + role, { method: 'PUT', body: JSON.stringify({ permissions: modules }) });
    }
    pendingPerms = {};
    toast('تم حفظ الصلاحيات بنجاح');
    loadPermissions();
    // Refresh current user permissions
    const me = await api('/api/me');
    state.user = me.user;
    state.permissions = me.user.permissions || {};
    buildNav();
  } catch (e) { toast(e.message, true); }
}

/* ================= SETTINGS ================= */
async function loadSettings() {
  const v = document.getElementById('viewSettings');
  v.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
  try {
    const d = await api('/api/settings');
    const s = d.settings;
    v.innerHTML = `
      <div class="card" style="max-width:620px;margin:auto;">
        <div class="card-h"><h3>⚙️ إعدادات النظام</h3></div>
        <div class="card-b">
          <div class="info-grid">
            <div class="info-item"><span class="label">اسم الشركة:</span><input type="text" id="setCompany" value="${esc(s.company_name || 'شركة مطاعم معصوب حليب')}" ${!hasPermission('settings', 'update') ? 'disabled' : ''}></div>
            <div class="info-item"><span class="label">الوصف:</span><input type="text" id="setCompanySub" value="${esc(s.company_subtitle || 'لتقديم الوجبات')}" ${!hasPermission('settings', 'update') ? 'disabled' : ''}></div>
          </div>
          ${hasPermission('settings', 'update') ? `
          <div class="toolbar" style="justify-content:flex-end;">
            <button class="btn btn-green" onclick="saveSettings()">💾 حفظ الإعدادات</button>
          </div>` : ''}
        </div>
      </div>`;
  } catch (e) { v.innerHTML = '<div class="loading">' + esc(e.message) + '</div>'; }
}
async function saveSettings() {
  try {
    await api('/api/settings', { method: 'PUT', body: JSON.stringify({
      company_name: document.getElementById('setCompany').value,
      company_subtitle: document.getElementById('setCompanySub').value
    }) });
    document.getElementById('sideCompany').textContent = document.getElementById('setCompany').value;
    toast('تم حفظ الإعدادات');
  } catch (e) { toast(e.message, true); }
}

/* ================= SHARED REFRESH ================= */
async function refreshShared() {
  try {
    if (hasPermission('branches', 'read')) {
      const b = await api('/api/branches');
      state.branches = b.branches;
    }
    if (hasPermission('items', 'read')) {
      const i = await api('/api/items');
      state.items = i.items;
    }
    if (currentPage === 'form') { formInitDone = false; initFormView(); }
  } catch (e) {}
}

/* ================= INIT ================= */
window.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('loginView').style.display !== 'none') doLogin(); });
if (state.token) {
  api('/api/me').then(d => { state.user = d.user; enterApp(); })
    .catch(() => { state.token = null; localStorage.removeItem('wasteToken'); });
}
(async () => {
  if (!state.token) return;
  try {
    const b = await api('/api/branches'); state.branches = b.branches;
    const i = await api('/api/items'); state.items = i.items;
  } catch (e) {}
})();
</script>
